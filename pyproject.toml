[project]
name = "cartwheel"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ultralytics>=8.3,<9",
    "pillow>=11,<13",
    "numpy>=2,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "python-multipart>=0.0.20,<1",
    "lap>=0.5.12,<0.6",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
